name: 链接有效性巡检

on:
  schedule:
    # 每周一 北京时间 09:00（UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查正文中的推广链接
        id: check
        run: |
          set +e
          python3 tools/link_watch.py --summary-file link-summary.txt > link-report.txt 2>&1
          code=$?
          set -e
          cat link-report.txt
          if [ "$code" = "10" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录到 issue（长期留档）
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh issue list --state open --search "链接失效提醒 in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.txt
          else
            gh issue create \
              --title "链接失效提醒（$(date -u +%Y-%m-%d)）" \
              --body-file link-report.txt
          fi

      - name: 发送手机提醒
        if: steps.check.outputs.failed == 'true'
        env:
          SMSBAO_USER: ${{ secrets.SMSBAO_USER }}
          SMSBAO_PASS: ${{ secrets.SMSBAO_PASS }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          WECHAT_WORK_WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          SMS_WEBHOOK_URL: ${{ secrets.SMS_WEBHOOK_URL }}
        run: |
          python3 tools/notify.py --text-file link-summary.txt
