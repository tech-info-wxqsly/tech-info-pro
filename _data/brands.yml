# 品牌单一事实来源。
#
# 全站所有推广入口、品牌卡片、价格表头都从这里取数据——改价格只改这里，
# 不需要去翻每一篇文章。新增品牌 = 在这里加一段 + 建一个品牌页。
#
# 字段说明：
#   slug        目录名与 front matter 里 brand 的取值，必须与页面路径一致
#   vertical    归属栏目，取值必须是 verticals.yml 里的 slug
#   order       同栏目内的展示顺序（数字，小的在前）。
#               必须有：hub.html 用 sort: "order" 排品牌卡片，字段缺失时
#               所有 key 都是 nil，Ruby 的 sort 不是稳定排序，卡片顺序会在
#               本地和线上之间随机漂移。
#   badge       卡片角标，留空则不显示
#   aff         推广入口（全站唯一维护点）
#   entries     额外入口，机场常见「同一家的多个线路入口」
#   price_page  官方完整价目页
#   price_rows  价格概览，列顺序见 brand.html 模板的固定表头
#   highlights  三到五条卖点，实测口吻，不写广告词
#   fit_for     适合谁
#   caveat      需要注意的地方（保持实测基调，这条不能省）
#   updated     最后核对官方价格的日期

